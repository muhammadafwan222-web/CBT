function toast(msg,type='ok',action){const r=$('#toast-root');const t=document.createElement('div');const col={ok:'border-sukses-500 text-sukses-700',err:'border-bahaya-500 text-bahaya-700',warn:'border-pensil-500 text-pensil-700',info:'border-biru-500 text-biru-700'}[type];const icn={ok:'check',err:'alert',warn:'alert',info:'live'}[type];
t.className=`pop-in bg-white border-l-4 ${col} shadow-lift rounded-xl px-4 py-3 flex items-center gap-3 text-sm font-semibold max-w-sm`;
t.innerHTML=`<span class="shrink-0">${ic(icn,'w-5 h-5')}</span><span class="text-ink-800 flex-1">${msg}</span>${action?`<button class="btn-xs btn-soft shrink-0">${esc(action.label)}</button>`:''}<button class="text-ink-300 hover:text-ink-600 shrink-0">${ic('x','w-4 h-4')}</button>`;
const kill=()=>{t.style.transition='all .3s';t.style.opacity='0';t.style.transform='translateX(20px)';setTimeout(()=>t.remove(),300);};
if(action){t.querySelectorAll('button')[0].onclick=()=>{action.fn();kill();};t.querySelectorAll('button')[1].onclick=kill;}
else t.querySelectorAll('button')[0].onclick=kill;
r.appendChild(t);setTimeout(kill,action?8000:4200);}
let modalStack=[];
function openModal(html,maxw='max-w-lg'){const r=$('#modal-root');const w=document.createElement('div');w.className='fixed inset-0 z-[90] flex items-center justify-center p-4 bg-ink-950/60 backdrop-blur-sm';w.innerHTML=`<div class="pop-in bg-kertas-50 rounded-3xl shadow-lift w-full ${maxw} max-h-[92vh] flex flex-col border border-kertas-300 overflow-hidden">${html}</div>`;w.addEventListener('mousedown',e=>{if(e.target===w)closeModal(w);});r.appendChild(w);modalStack.push(w);return w;}
function closeModal(w){if(!w){w=modalStack[modalStack.length-1];}if(!w)return;modalStack=modalStack.filter(x=>x!==w);w.remove();}
function confirmBox({title,body,okText='Lanjutkan',danger=false}){return new Promise(res=>{const w=openModal(`<div class="p-7"><div class="w-12 h-12 rounded-2xl ${danger?'bg-bahaya-50 text-bahaya-600':'bg-biru-50 text-biru-600'} flex items-center justify-center mb-4">${ic(danger?'alert':'shield','w-6 h-6')}</div><h3 class="font-disp text-xl font-bold text-ink-900 mb-2">${title}</h3><div class="text-sm text-ink-500 leading-relaxed">${body}</div><div class="flex justify-end gap-3 mt-7"><button data-c="0" class="btn-ghost">Batal</button><button data-c="1" class="${danger?'btn-danger':'btn-pri'}">${okText}</button></div></div>`);w.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{closeModal(w);res(b.dataset.c==='1');});});}
function openDrawer(html){closeDrawer();const r=$('#drawer-root');const w=document.createElement('div');w.id='drawer-wrap';w.className='fixed inset-0 z-[85]';w.innerHTML=`<div class="absolute inset-0 bg-ink-950/50 backdrop-blur-sm" data-dclose></div><div class="drawer-in absolute right-0 top-0 bottom-0 w-full max-w-xl bg-kertas-50 shadow-lift border-l border-kertas-300 flex flex-col">${html}</div>`;w.querySelector('[data-dclose]').onclick=closeDrawer;r.appendChild(w);return w;}
function closeDrawer(){$('#drawer-root').innerHTML='';}
function drawerHead(title,sub){return `<div class="px-6 py-5 border-b border-kertas-300 bg-white flex items-start justify-between gap-4 shrink-0"><div><h3 class="font-disp text-lg font-bold text-ink-900">${title}</h3>${sub?`<p class="text-xs text-ink-400 mt-0.5">${sub}</p>`:''}</div><button class="icon-btn" onclick="closeDrawer()">${ic('x','w-5 h-5')}</button></div>`;}

function bindActs(root,map){root.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!root.contains(el))return;const fn=map[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}});}
function statusKey(p){const n=Date.now(),m=new Date(p.waktu_mulai).getTime(),s=new Date(p.waktu_selesai).getTime();return n<m?'akan':n<=s?'aktif':'selesai';}
function chipStatus(p){const k=statusKey(p);return k==='akan'?'<span class="chip-amber">⏳ Akan Datang</span>':k==='aktif'?'<span class="chip-green"><span class="w-1.5 h-1.5 rounded-full bg-sukses-500 live-dot"></span> Aktif</span>':'<span class="chip-gray">🛑 Selesai</span>';}
function ljkArt(rows=6){let h='<div class="ljk">';const keys=[1,2,0,3,1,2];for(let r=0;r<rows;r++){h+=`<div class="ljk-row"><span class="ljk-no">${pad(r+1)}</span>`;for(let c=0;c<4;c++){const fill=c===keys[r%6];h+=`<span class="bub ${fill?'anim':''}" style="animation-delay:${(r*0.55+c*0.12).toFixed(2)}s">${'ABCD'[c]}</span>`;}h+='</div>';}return h+'</div>';}

const RE_AR=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/;
function formatTeksSoal(teks){if(!teks)return'';let t=esc(String(teks));t=t.replace(/\n/g,'<br>');
t=t.replace(/\[([^\]\[]+\.(?:jpe?g|png|gif|webp|bmp|avif))\]/gi,(m,f)=>{const url=DB.imageUrl(f);return `<div class="my-4 flex flex-col items-center"><img src="${url}" loading="lazy" data-zoom="${url}" class="max-w-full max-h-[300px] object-contain rounded-2xl shadow-card border border-kertas-300 cursor-zoom-in hover:opacity-90 transition bg-white" onerror="this.outerHTML='<span class=&quot;chip-red my-2&quot;>Gambar tidak ditemukan: ${esc(f)}</span>'"><span class="text-[10px] text-ink-300 italic mt-1.5">ketuk untuk memperbesar</span></div>`;});
t=t.replace(/\$\$([\s\S]+?)\$\$/g,(m,eq)=>'<div class="math-display">$$'+eq.replace(/<br\s*\/?>/g,'\n')+'$$</div>');
t=t.replace(/\$([^$\n]+?)\$/g,'<span class="math-inline">$$$1$$</span>');
t=t.replace(/([\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF][\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF\s\u064B-\u065F\u0670\u0610-\u061A\u06D6-\u06DC\u06DF-\u06E8\u06EA-\u06ED\u0640\u060C\u061B\u061F.,!?]*)/g,m=>RE_AR.test(m)?'<span class="arabic-text">'+m+'</span>':m);
return t;}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function orderSoal(soal,acakSoal,acakOpsi){const clone=soal.map((s,i)=>({...s,opsi:[...(s.opsi||[])],_orig:i}));let pg=clone.filter(s=>(s.tipe||'PG')==='PG'),es=clone.filter(s=>s.tipe==='Essay');if(acakSoal){pg=shuffle(pg);es=shuffle(es);}if(acakOpsi)pg.forEach(s=>s.opsi=shuffle(s.opsi));return[...pg,...es];}

const SQL_SCHEMA=`-- ══════════════════════════════════════════════════════════════
-- CBT PRO v5.2 · Skema + Fungsi Aman Supabase
-- Jalankan SEKALI di SQL Editor. Aman dijalankan ulang (idempotent).
-- Juga berfungsi sebagai UPGRADE dari skema v5.0 lama:
-- policy anon_all lama dicabut, tabel dikunci, fungsi RPC dibuat.
-- KEAMANAN:
--  · Tabel sensitif TIDAK bisa diakses langsung oleh anon (revoked)
--  · Siswa hanya lewat RPC: soal dikirim TANPA kunci jawaban
--  · Koreksi PG dilakukan di SERVER (tidak bisa dicurangi)
--  · Login panel divalidasi server + token sesi HMAC-SHA256 (4 jam)
-- ══════════════════════════════════════════════════════════════
create extension if not exists pgcrypto;

create table if not exists public.users (
  id bigint primary key,
  username text unique not null,
  password_hash text not null,
  nama_lengkap text not null,
  mapel text default '',
  role text not null check (role in ('admin','pengawas','guru')),
  created_at timestamptz default now()
);
create table if not exists public.bank_soal (
  id bigint primary key,
  guru_id bigint references public.users(id) on delete cascade,
  nama_bank text not null,
  mapel text not null,
  soal_json jsonb default '[]',
  created_at timestamptz default now()
);
create table if not exists public.paket (
  token text primary key,
  mapel text not null,
  waktu_mulai timestamptz not null,
  waktu_selesai timestamptz not null,
  durasi_menit int default 90,
  soal_json jsonb default '[]',
  guru_id bigint,
  keterangan text default '',
  acak_soal boolean default true,
  acak_opsi boolean default true,
  mode_offline boolean default false,
  created_at timestamptz default now()
);
create table if not exists public.hasil (
  id bigint primary key,
  waktu timestamptz default now(),
  mapel text, nama text, kelas text, nis text,
  skor_pg numeric default 0,
  skor_essay numeric,
  jawaban_essay jsonb default '{}',
  nilai_essay jsonb,
  detail_jawaban jsonb,
  pelanggaran int default 0,
  token text
);
create unique index if not exists hasil_uniq on public.hasil(token, nis, mapel);
create table if not exists public.pengaturan (key text primary key, value text);
create table if not exists public.log_aktivitas (
  id bigint primary key,
  waktu timestamptz default now(),
  username text, role text, aksi text, detail text
);
-- Rahasia HMAC — TIDAK BISA dibaca klien
create table if not exists public.app_secret (
  id boolean primary key default true check (id),
  secret text not null
);
insert into public.app_secret (id, secret)
select true, encode(gen_random_bytes(32),'hex')
where not exists (select 1 from public.app_secret);

-- ── RLS aktif + cabut akses langsung anon dari tabel sensitif ──
do $$
declare t text;
begin
  foreach t in array array['users','bank_soal','paket','hasil','pengaturan','log_aktivitas','app_secret'] loop
    execute format('alter table public.%I enable row level security', t);
  end loop;
  foreach t in array array['users','bank_soal','paket','hasil','log_aktivitas'] loop
    execute format('drop policy if exists anon_all on public.%I', t);
  end loop;
end $$;
revoke all on public.users, public.bank_soal, public.paket, public.hasil,
  public.log_aktivitas, public.app_secret from anon, authenticated;
revoke insert, update, delete on public.pengaturan from anon, authenticated;

-- ── Helper internal (tidak dipanggil klien) ──
create or replace function public.new_id() returns bigint language sql volatile as $$
  select (floor(extract(epoch from clock_timestamp()) * 100))::bigint + (floor(random()*100))::int
$$;
revoke execute on function public.new_id() from public, anon;

create or replace function public.cocok_pass(p_hash text, p_input text) returns boolean
language plpgsql security definer set search_path = public as $$
begin
  if p_hash like 'sha256:%' then
    return p_hash = 'sha256:' || encode(digest(p_input,'sha256'),'hex');
  elsif p_hash like 'plain:%' then
    return p_hash = 'plain:' || p_input;
  else
    return p_hash = p_input;
  end if;
end $$;
revoke execute on function public.cocok_pass(text,text) from public, anon;

create or replace function public.buat_token(p_uid bigint, p_role text)
returns jsonb language plpgsql security definer set search_path = public as $$
declare v_secret text; v_exp bigint; v_payload text;
begin
  select secret into v_secret from public.app_secret;
  v_exp := (extract(epoch from now()) + 14400)::bigint; -- 4 jam
  v_payload := p_uid || ':' || p_role || ':' || v_exp;
  return jsonb_build_object('token', v_payload || '.' || encode(hmac(v_payload, v_secret, 'sha256'),'hex'), 'exp', v_exp*1000);
end $$;
revoke execute on function public.buat_token(bigint,text) from public, anon;

create or replace function public._auth(p_token text)
returns table(user_id bigint, role text)
language plpgsql security definer set search_path = public as $$
declare v_secret text; v_parts text[]; v_exp bigint;
begin
  if p_token is null or position('.' in coalesce(p_token,'')) = 0 then
    raise exception 'Sesi tidak valid. Silakan login ulang.';
  end if;
  v_parts := string_to_array(p_token, '.');
  if array_length(v_parts,1) <> 2 then raise exception 'Sesi tidak valid. Silakan login ulang.'; end if;
  select secret into v_secret from public.app_secret;
  if encode(hmac(v_parts[1], v_secret, 'sha256'),'hex') <> v_parts[2] then
    raise exception 'Sesi tidak valid. Silakan login ulang.';
  end if;
  v_exp := split_part(v_parts[1],':',3)::bigint;
  if v_exp < extract(epoch from now())::bigint then
    raise exception 'Sesi berakhir. Silakan login ulang.';
  end if;
  user_id := split_part(v_parts[1],':',1)::bigint;
  role := split_part(v_parts[1],':',2);
  return next;
end $$;
revoke execute on function public._auth(text) from public, anon;

-- ── LOGIN PETUGAS/GURU (validasi server + upgrade hash otomatis) ──
create or replace function public.login_petugas(p_username text, p_password text)
returns jsonb language plpgsql security definer set search_path = public as $$
declare u public.users%rowtype; v_ok boolean := false; v_tok jsonb;
begin
  if coalesce(trim(p_username),'') <> '' then
    select * into u from public.users where username = trim(p_username) and role = 'guru';
    if not found then return jsonb_build_object('status','error','msg','Username atau password salah!'); end if;
    v_ok := public.cocok_pass(u.password_hash, p_password);
  else
    for u in select * from public.users where role in ('admin','pengawas') loop
      if public.cocok_pass(u.password_hash, p_password) then v_ok := true; exit; end if;
    end loop;
  end if;
  if not v_ok then return jsonb_build_object('status','error','msg', case when coalesce(trim(p_username),'')='' then 'Password salah!' else 'Username atau password salah!' end); end if;
  if u.password_hash like 'plain:%' then
    update public.users set password_hash = 'sha256:' || encode(digest(p_password,'sha256'),'hex') where id = u.id;
  end if;
  v_tok := public.buat_token(u.id, u.role);
  insert into public.log_aktivitas (id,waktu,username,role,aksi,detail)
  values (public.new_id(), now(), u.username, u.role, 'LOGIN', u.role || ' masuk panel');
  return jsonb_build_object('status','success',
    'user', jsonb_build_object('id',u.id,'username',u.username,'nama',u.nama_lengkap,'mapel',coalesce(u.mapel,''),'role',u.role),
    'token', v_tok->>'token', 'exp', v_tok->>'exp');
end $$;
grant execute on function public.login_petugas(text,text) to anon;

-- ── SISWA: ambil paket TANPA kunci jawaban ──
create or replace function public.ambil_paket_siswa(p_token text)
returns jsonb language plpgsql security definer set search_path = public as $$
declare p public.paket%rowtype; v_soal jsonb;
begin
  select * into p from public.paket
  where token = upper(regexp_replace(coalesce(p_token,''),'[^A-Za-z0-9]','','g'));
  if not found then raise exception 'Token tidak ditemukan. Periksa kembali.'; end if;
  if now() < p.waktu_mulai then
    raise exception 'Ujian belum dimulai. Mulai: %', to_char(p.waktu_mulai at time zone 'Asia/Makassar','DD Mon YYYY HH24:MI');
  end if;
  if now() > p.waktu_selesai then raise exception 'Waktu ujian untuk token ini sudah berakhir.'; end if;
  select coalesce(jsonb_agg(case when coalesce(elem->>'tipe','PG') = 'PG' then elem - 'jawaban' else elem end),'[]'::jsonb)
  into v_soal from jsonb_array_elements(p.soal_json) elem;
  if jsonb_array_length(v_soal) = 0 then raise exception 'Paket ini belum memiliki soal.'; end if;
  return jsonb_build_object(
    'token',p.token,'mapel',p.mapel,'durasi_menit',p.durasi_menit,
    'keterangan',coalesce(p.keterangan,''),'acak_soal',p.acak_soal,'acak_opsi',p.acak_opsi,
    'mode_offline',coalesce(p.mode_offline,false),'waktu_mulai',p.waktu_mulai,'waktu_selesai',p.waktu_selesai,
    'soal_json',v_soal);
end $$;
grant execute on function public.ambil_paket_siswa(text) to anon;

-- ── PUBLIK: jadwal ringan (tanpa soal) ──
create or replace function public.jadwal_publik()
returns jsonb language plpgsql security definer set search_path = public as $$
declare v_out jsonb;
begin
  select coalesce(jsonb_agg(jsonb_build_object(
    'token',token,'mapel',mapel,'waktu_mulai',waktu_mulai,'waktu_selesai',waktu_selesai,
    'durasi_menit',durasi_menit,'keterangan',keterangan,'acak_soal',acak_soal,'acak_opsi',acak_opsi,
    'mode_offline',coalesce(mode_offline,false),'guru_id',guru_id,'created_at',created_at)
    order by waktu_mulai desc),'[]'::jsonb)
  into v_out from public.paket;
  return v_out;
end $$;
grant execute on function public.jadwal_publik() to anon;

-- ── SISWA: submit + KOREKSI PG DI SERVER ──
create or replace function public.submit_jawaban_siswa(
  p_token text, p_nama text, p_kelas text, p_nis text,
  p_jawaban jsonb, p_pelanggaran int default 0)
returns jsonb language plpgsql security definer set search_path = public as $$
declare p public.paket%rowtype; elem jsonb; i int := 0;
        v_skor numeric := 0; v_essay jsonb := '{}'::jsonb; v_jwb text;
begin
  select * into p from public.paket
  where token = upper(regexp_replace(coalesce(p_token,''),'[^A-Za-z0-9]','','g'));
  if not found then raise exception 'Paket tidak ditemukan.'; end if;
  for elem in select * from jsonb_array_elements(p.soal_json) loop
    v_jwb := coalesce(p_jawaban->>i::text,'');
    if coalesce(elem->>'tipe','PG') = 'PG' then
      if trim(v_jwb) <> '' and trim(v_jwb) = trim(coalesce(elem->>'jawaban','')) then
        v_skor := v_skor + coalesce((elem->>'poin')::numeric, 0);
      end if;
    else
      v_essay := v_essay || jsonb_build_object('Soal_'||(i+1)::text, v_jwb);
    end if;
    i := i + 1;
  end loop;
  insert into public.hasil (id,waktu,token,mapel,nama,kelas,nis,skor_pg,jawaban_essay,detail_jawaban,pelanggaran)
  values (public.new_id(), now(), p.token, p.mapel, p_nama, p_kelas, p_nis, v_skor,
          v_essay, coalesce(p_jawaban,'{}'::jsonb), coalesce(p_pelanggaran,0))
  on conflict (token,nis,mapel) do update set
    waktu=now(), skor_pg=excluded.skor_pg, jawaban_essay=excluded.jawaban_essay,
    detail_jawaban=excluded.detail_jawaban, pelanggaran=excluded.pelanggaran;
  insert into public.log_aktivitas (id,waktu,username,role,aksi,detail)
  values (public.new_id(), now(), p_nis, 'siswa', 'SUBMIT', p_nama||' · '||p.token||' · PG '||v_skor);
  return jsonb_build_object('status','success','skor_pg',v_skor);
end $$;
grant execute on function public.submit_jawaban_siswa(text,text,text,text,jsonb,int) to anon;

-- ── PANEL: semua operasi Guru/Admin (wajib token HMAC) ──
create or replace function public.panel(p_op text, p_payload jsonb default '{}'::jsonb, p_token text default '')
returns jsonb language plpgsql security definer set search_path = public as $$
declare
  v_uid bigint; v_role text; v_out jsonb := '{}'::jsonb; v_tmp jsonb; v_id bigint; v_tok text;
begin
  if p_op = 'seed' and (select count(*) from public.users) = 0 then
    v_uid := 0; v_role := 'admin';
  else
    select a.user_id, a.role into v_uid, v_role from public._auth(p_token) a;
    if v_role not in ('admin','pengawas','guru') then raise exception 'Akses ditolak.'; end if;
  end if;

  case p_op

  when 'guru_list' then
    if v_role not in ('admin','pengawas') then raise exception 'Akses ditolak.'; end if;
    select coalesce(jsonb_agg(jsonb_build_object('id',u.id,'username',u.username,'nama_lengkap',u.nama_lengkap,
      'mapel',u.mapel,'role',u.role,'created_at',u.created_at,
      'jumlah_bank',(select count(*) from public.bank_soal b where b.guru_id = u.id)) order by u.created_at desc),'[]'::jsonb)
    into v_out from public.users u where u.role = 'guru';

  when 'guru_save' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    if p_payload->>'id' is null then
      if exists(select 1 from public.users where username = p_payload->>'username') then
        raise exception 'Username sudah digunakan!';
      end if;
      insert into public.users (id,username,password_hash,nama_lengkap,mapel,role)
      values (public.new_id(), p_payload->>'username',
        'sha256:'||encode(digest(p_payload->>'password','sha256'),'hex'),
        p_payload->>'nama', p_payload->>'mapel', 'guru');
    else
      update public.users set nama_lengkap = p_payload->>'nama', mapel = p_payload->>'mapel',
        password_hash = case when coalesce(p_payload->>'password','') <> ''
          then 'sha256:'||encode(digest(p_payload->>'password','sha256'),'hex') else password_hash end
      where id = (p_payload->>'id')::bigint and role = 'guru';
    end if;
    v_out := '{"ok":true}'::jsonb;

  when 'guru_del' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    select jsonb_build_object('user', row_to_json(u)::jsonb,
      'banks', coalesce((select jsonb_agg(row_to_json(b)::jsonb) from public.bank_soal b
                         where b.guru_id = (p_payload->>'id')::bigint),'[]'::jsonb))
    into v_out from public.users u where u.id = (p_payload->>'id')::bigint and u.role='guru';
    delete from public.users where id = (p_payload->>'id')::bigint and role='guru';

  when 'guru_restore' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    insert into public.users select * from jsonb_populate_record(null::public.users, p_payload->'user') on conflict (id) do nothing;
    insert into public.bank_soal select * from jsonb_populate_recordset(null::public.bank_soal, coalesce(p_payload->'banks','[]'::jsonb)) on conflict (id) do nothing;
    v_out := '{"ok":true}'::jsonb;

  when 'bank_list' then
    if v_role = 'guru' then
      select coalesce(jsonb_agg(row_to_json(b)::jsonb order by b.created_at desc),'[]'::jsonb)
      into v_out from public.bank_soal b where b.guru_id = v_uid;
    else
      select coalesce(jsonb_agg(row_to_json(b)::jsonb order by b.created_at desc),'[]'::jsonb)
      into v_out from public.bank_soal b;
    end if;

  when 'bank_get' then
    select row_to_json(b)::jsonb into v_out from public.bank_soal b where b.id = (p_payload->>'id')::bigint;
    if v_out is null then raise exception 'Bank tidak ditemukan.'; end if;
    if v_role = 'guru' and (v_out->>'guru_id')::bigint is distinct from v_uid then raise exception 'Tidak berhak.'; end if;

  when 'bank_save' then
    v_tmp := p_payload->'row';
    if v_role = 'guru' then v_tmp := jsonb_set(v_tmp,'{guru_id}',to_jsonb(v_uid)); end if;
    if v_tmp->>'id' is null then
      v_id := public.new_id();
      insert into public.bank_soal (id,guru_id,nama_bank,mapel,soal_json)
      values (v_id,(v_tmp->>'guru_id')::bigint,v_tmp->>'nama_bank',v_tmp->>'mapel',coalesce(v_tmp->'soal_json','[]'::jsonb));
      v_out := jsonb_build_object('id',v_id);
    else
      update public.bank_soal set nama_bank=v_tmp->>'nama_bank', mapel=v_tmp->>'mapel', soal_json=coalesce(v_tmp->'soal_json','[]'::jsonb)
      where id=(v_tmp->>'id')::bigint and (v_role<>'guru' or guru_id=v_uid);
      v_out := v_tmp;
    end if;

  when 'bank_del' then
    select row_to_json(b)::jsonb into v_out from public.bank_soal b where b.id = (p_payload->>'id')::bigint;
    if v_out is null then raise exception 'Bank tidak ditemukan.'; end if;
    if v_role = 'guru' and (v_out->>'guru_id')::bigint is distinct from v_uid then raise exception 'Tidak berhak.'; end if;
    delete from public.bank_soal where id = (p_payload->>'id')::bigint;

  when 'bank_restore' then
    insert into public.bank_soal select * from jsonb_populate_recordset(null::public.bank_soal, coalesce(p_payload->'rows','[]'::jsonb)) on conflict (id) do nothing;
    v_out := '{"ok":true}'::jsonb;

  when 'paket_list' then
    if v_role = 'guru' then
      select coalesce(jsonb_agg(row_to_json(p)::jsonb order by p.waktu_mulai desc),'[]'::jsonb)
      into v_out from public.paket p where p.guru_id = v_uid;
    else
      select coalesce(jsonb_agg(row_to_json(p)::jsonb order by p.waktu_mulai desc),'[]'::jsonb)
      into v_out from public.paket p;
    end if;

  when 'paket_get' then
    select row_to_json(p)::jsonb into v_out from public.paket p where p.token = p_payload->>'token';
    if v_out is null then raise exception 'Paket tidak ditemukan.'; end if;
    if v_role = 'guru' and (v_out->>'guru_id')::bigint is distinct from v_uid then raise exception 'Tidak berhak.'; end if;

  when 'paket_save' then
    v_tmp := p_payload->'row';
    if v_role = 'guru' then v_tmp := jsonb_set(v_tmp,'{guru_id}',to_jsonb(v_uid)); end if;
    v_tok := v_tmp->>'token';
    if coalesce(p_payload->>'old_token','') <> '' and p_payload->>'old_token' <> v_tok then
      if exists(select 1 from public.paket where token = v_tok) then raise exception 'Token sudah digunakan.'; end if;
      delete from public.paket where token = p_payload->>'old_token' and (v_role<>'guru' or guru_id=v_uid);
      insert into public.paket select * from jsonb_populate_record(null::public.paket, v_tmp);
    else
      if exists(select 1 from public.paket where token = v_tok) then
        update public.paket set mapel=v_tmp->>'mapel',
          waktu_mulai=(v_tmp->>'waktu_mulai')::timestamptz, waktu_selesai=(v_tmp->>'waktu_selesai')::timestamptz,
          durasi_menit=(v_tmp->>'durasi_menit')::int, soal_json=coalesce(v_tmp->'soal_json','[]'::jsonb),
          keterangan=coalesce(v_tmp->>'keterangan',''),
          acak_soal=coalesce((v_tmp->>'acak_soal')::boolean,true), acak_opsi=coalesce((v_tmp->>'acak_opsi')::boolean,true),
          mode_offline=coalesce((v_tmp->>'mode_offline')::boolean,false)
        where token=v_tok and (v_role<>'guru' or guru_id=v_uid);
      else
        insert into public.paket select * from jsonb_populate_record(null::public.paket, v_tmp);
      end if;
    end if;
    v_out := jsonb_build_object('token',v_tok);

  when 'paket_del' then
    select row_to_json(p)::jsonb into v_out from public.paket p where p.token = p_payload->>'token';
    if v_out is null then raise exception 'Paket tidak ditemukan.'; end if;
    if v_role = 'guru' and (v_out->>'guru_id')::bigint is distinct from v_uid then raise exception 'Tidak berhak.'; end if;
    delete from public.paket where token = p_payload->>'token';

  when 'paket_restore' then
    insert into public.paket select * from jsonb_populate_record(null::public.paket, p_payload->'row') on conflict (token) do nothing;
    v_out := '{"ok":true}'::jsonb;

  when 'hasil_list' then
    if v_role = 'guru' and jsonb_typeof(coalesce(p_payload->'tokens','null'::jsonb)) <> 'array' then
      v_out := '[]'::jsonb;
    elsif jsonb_typeof(coalesce(p_payload->'tokens','null'::jsonb)) = 'array' then
      if jsonb_array_length(p_payload->'tokens') = 0 then
        v_out := '[]'::jsonb;
      elsif coalesce((p_payload->>'light')::boolean,false) then
        select coalesce(jsonb_agg(jsonb_build_object('id',h.id,'waktu',h.waktu,'token',h.token,'mapel',h.mapel,
          'nama',h.nama,'kelas',h.kelas,'nis',h.nis,'skor_pg',h.skor_pg,'skor_essay',h.skor_essay,
          'pelanggaran',h.pelanggaran,'punya_essay',(h.jawaban_essay is not null and h.jawaban_essay <> '{}'::jsonb)) order by h.id desc),'[]'::jsonb)
        into v_out from public.hasil h where h.token in (select jsonb_array_elements_text(p_payload->'tokens'));
      else
        select coalesce(jsonb_agg(row_to_json(h)::jsonb order by h.id desc),'[]'::jsonb)
        into v_out from public.hasil h where h.token in (select jsonb_array_elements_text(p_payload->'tokens'));
      end if;
    elsif coalesce((p_payload->>'light')::boolean,false) then
      select coalesce(jsonb_agg(jsonb_build_object('id',h.id,'waktu',h.waktu,'token',h.token,'mapel',h.mapel,
        'nama',h.nama,'kelas',h.kelas,'nis',h.nis,'skor_pg',h.skor_pg,'skor_essay',h.skor_essay,
        'pelanggaran',h.pelanggaran,'punya_essay',(h.jawaban_essay is not null and h.jawaban_essay <> '{}'::jsonb)) order by h.id desc),'[]'::jsonb)
      into v_out from public.hasil h;
    else
      select coalesce(jsonb_agg(row_to_json(h)::jsonb order by h.id desc),'[]'::jsonb)
      into v_out from (select * from public.hasil order by id desc limit 1500) h;
    end if;

  when 'hasil_grade' then
    if v_role = 'pengawas' then raise exception 'Akses ditolak.'; end if;
    update public.hasil set nilai_essay = p_payload->'nilai', skor_essay = (p_payload->>'skor')::numeric
    where id = (p_payload->>'id')::bigint;
    v_out := '{"ok":true}'::jsonb;

  when 'hasil_del' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    select coalesce(jsonb_agg(row_to_json(h)::jsonb),'[]'::jsonb) into v_out
    from public.hasil h where h.id in (select (jsonb_array_elements_text(p_payload->'ids'))::bigint);
    delete from public.hasil where id in (select (jsonb_array_elements_text(p_payload->'ids'))::bigint);

  when 'hasil_restore' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    insert into public.hasil select * from jsonb_populate_recordset(null::public.hasil, coalesce(p_payload->'rows','[]'::jsonb))
    on conflict (token,nis,mapel) do nothing;
    v_out := '{"ok":true}'::jsonb;

  when 'hasil_clear' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    select coalesce(jsonb_agg(row_to_json(h)::jsonb),'[]'::jsonb) into v_out from public.hasil h;
    delete from public.hasil;

  when 'set_save' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    insert into public.pengaturan (key,value)
    select k, v from jsonb_each_text(p_payload->'settings') as kv(k,v)
    on conflict (key) do update set value = excluded.value;
    v_out := '{"ok":true}'::jsonb;

  when 'log_list' then
    select coalesce(jsonb_agg(jsonb_build_object('waktu',waktu,'username',username,'role',role,'aksi',aksi,'detail',detail) order by id desc),'[]'::jsonb)
    into v_out from (select * from public.log_aktivitas order by id desc limit coalesce((p_payload->>'limit')::int,30)) x;

  when 'log_add' then
    insert into public.log_aktivitas (id,waktu,username,role,aksi,detail)
    values (public.new_id(), now(), (select username from public.users where id=v_uid), v_role,
            p_payload->>'aksi', coalesce(p_payload->>'detail',''));
    v_out := '{"ok":true}'::jsonb;

  when 'log_clear' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    delete from public.log_aktivitas;
    v_out := '{"ok":true}'::jsonb;

  when 'backup' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    select jsonb_build_object('app','CBT PRO','version',5,'exported_at',now(),
      'data', jsonb_build_object(
        'users',(select coalesce(jsonb_agg(row_to_json(u)),'[]'::jsonb) from public.users u),
        'bank_soal',(select coalesce(jsonb_agg(row_to_json(b)),'[]'::jsonb) from public.bank_soal b),
        'paket',(select coalesce(jsonb_agg(row_to_json(p)),'[]'::jsonb) from public.paket p),
        'hasil',(select coalesce(jsonb_agg(row_to_json(h)),'[]'::jsonb) from public.hasil h),
        'pengaturan',(select coalesce(jsonb_object_agg(key,value),'{}'::jsonb) from public.pengaturan),
        'log_aktivitas',(select coalesce(jsonb_agg(row_to_json(l)),'[]'::jsonb) from public.log_aktivitas l)))
    into v_out;

  when 'restore' then
    if v_role <> 'admin' then raise exception 'Akses ditolak.'; end if;
    v_tmp := p_payload->'data';
    if v_tmp is null or v_tmp->'users' is null or v_tmp->'paket' is null then raise exception 'Format backup tidak valid.'; end if;
    delete from public.hasil; delete from public.log_aktivitas; delete from public.bank_soal;
    delete from public.paket; delete from public.users;
    insert into public.users select * from jsonb_populate_recordset(null::public.users, v_tmp->'users');
    insert into public.bank_soal select * from jsonb_populate_recordset(null::public.bank_soal, coalesce(v_tmp->'bank_soal','[]'::jsonb));
    insert into public.paket select * from jsonb_populate_recordset(null::public.paket, v_tmp->'paket');
    insert into public.hasil select * from jsonb_populate_recordset(null::public.hasil, coalesce(v_tmp->'hasil','[]'::jsonb));
    insert into public.log_aktivitas select * from jsonb_populate_recordset(null::public.log_aktivitas, coalesce(v_tmp->'log_aktivitas','[]'::jsonb));
    insert into public.pengaturan (key,value) select k,v from jsonb_each_text(coalesce(v_tmp->'pengaturan','{}'::jsonb)) as kv(k,v)
      on conflict (key) do update set value = excluded.value;
    v_out := '{"ok":true}'::jsonb;

  when 'seed' then
    if (select count(*) from public.users) > 0 and v_role <> 'admin' then
      raise exception 'Login sebagai admin untuk memuat data demo.';
    end if;
    v_tmp := p_payload->'data';
    insert into public.users select * from jsonb_populate_recordset(null::public.users, v_tmp->'users') on conflict (id) do nothing;
    insert into public.pengaturan (key,value) select k,v from jsonb_each_text(coalesce(v_tmp->'pengaturan','{}'::jsonb)) as kv(k,v) on conflict (key) do nothing;
    insert into public.bank_soal select * from jsonb_populate_recordset(null::public.bank_soal, coalesce(v_tmp->'bank_soal','[]'::jsonb)) on conflict (id) do nothing;
    insert into public.paket select * from jsonb_populate_recordset(null::public.paket, coalesce(v_tmp->'paket','[]'::jsonb))
      on conflict (token) do update set mapel=excluded.mapel, waktu_mulai=excluded.waktu_mulai, waktu_selesai=excluded.waktu_selesai,
      durasi_menit=excluded.durasi_menit, soal_json=excluded.soal_json, keterangan=excluded.keterangan,
      acak_soal=excluded.acak_soal, acak_opsi=excluded.acak_opsi, mode_offline=excluded.mode_offline;
    insert into public.hasil select * from jsonb_populate_recordset(null::public.hasil, coalesce(v_tmp->'hasil','[]'::jsonb)) on conflict (token,nis,mapel) do nothing;
    v_out := '{"ok":true}'::jsonb;

  else
    raise exception 'Operasi tidak dikenal: %', p_op;
  end case;

  return v_out;
end $$;

/* ═══════════════════════ ADAPTER: LOKAL (DEMO) ═══════════════════════ */
class LocalDB{
constructor(){this.mode='local';this.key='cbt_local_db_v5';this.d=LS.get(this.key,null);if(!this.d){this.d=DEMO();this.save();}}
save(){LS.set(this.key,this.d);window.dispatchEvent(new CustomEvent('local-db'));}
async ping(){return true;}
async seedDemo(){this.d=DEMO();this.save();}
async getSettings(){return{...this.d.settings};}
async saveSettings(o){Object.assign(this.d.settings,o);this.save();}
async loginStaff(pass){for(const u of this.d.users.filter(x=>x.role!=='guru')){if(await verifyPass(u.password_hash,pass)){if(String(u.password_hash).startsWith('plain:'))await this.upgradePass(u.id,'sha256:'+await sha256(pass));return{role:u.role,id:u.id,username:u.username,nama:u.nama_lengkap,mapel:u.mapel};}}throw new Error('Password salah!');}
async loginGuru(username,pass){const u=this.d.users.find(x=>x.role==='guru'&&x.username===username);if(!u||!(await verifyPass(u.password_hash,pass)))throw new Error('Username atau password salah!');if(String(u.password_hash).startsWith('plain:'))await this.upgradePass(u.id,'sha256:'+await sha256(pass));return{role:'guru',id:u.id,username:u.username,nama:u.nama_lengkap,mapel:u.mapel};}
async upgradePass(id,hash){const u=this.d.users.find(x=>x.id===id);if(u){u.password_hash=hash;this.save();}}
async listGuru(){const banks=this.d.banks;return this.d.users.filter(u=>u.role==='guru').map(u=>({...u,password_hash:undefined,jumlah_bank:banks.filter(b=>b.guru_id===u.id).length})).sort((a,b)=>b.id-a.id);}
async createGuru(g){if(this.d.users.some(u=>u.username===g.username))throw new Error('Username sudah digunakan!');const row={id:uid(),created_at:nowISO(),role:'guru',username:g.username,password_hash:'sha256:'+await sha256(g.password),nama_lengkap:g.nama_lengkap,mapel:g.mapel};this.d.users.push(row);this.save();return row;}
async updateGuru(id,g){const u=this.d.users.find(x=>x.id===id);if(!u)throw new Error('Guru tidak ditemukan');u.nama_lengkap=g.nama_lengkap;u.mapel=g.mapel;if(g.password)u.password_hash='sha256:'+await sha256(g.password);this.save();}
async deleteGuru(id){const banks=this.d.banks.filter(b=>b.guru_id===id);const user=this.d.users.find(u=>u.id===id);this.d.banks=this.d.banks.filter(b=>b.guru_id!==id);this.d.users=this.d.users.filter(u=>u.id!==id);this.save();return{user,banks};}
async restoreGuru({user,banks}){if(user)this.d.users.push(user);(banks||[]).forEach(b=>this.d.banks.push(b));this.save();}
async listBanks(guruId){let b=this.d.banks;if(guruId)b=b.filter(x=>x.guru_id===guruId);return b.map(x=>({...x})).sort((a,b)=>b.id-a.id);}
async getBank(id){return this.d.banks.find(b=>b.id===id)||null;}
async saveBank(b){if(b.id){const i=this.d.banks.findIndex(x=>x.id===b.id);if(i>=0)this.d.banks[i]={...this.d.banks[i],...b};}else{b.id=uid();b.created_at=nowISO();this.d.banks.push(b);}this.save();return b;}
async deleteBank(id){const row=this.d.banks.find(b=>b.id===id);this.d.banks=this.d.banks.filter(b=>b.id!==id);this.save();return row;}
async restoreBanks(rows){rows.forEach(r=>this.d.banks.push(r));this.save();}
async listPaket(o={}){let p=this.d.pakets;if(o.guruId)p=p.filter(x=>x.guru_id===o.guruId);p=[...p].sort((a,b)=>new Date(b.waktu_mulai)-new Date(a.waktu_mulai));return o.light?p.map(({soal_json,...r})=>r):p.map(x=>({...x}));}
async getPaket(token){return this.d.pakets.find(p=>p.token===token)||null;}
async getPaketSiswa(token){const p=this.d.pakets.find(x=>x.token===token);
if(!p)throw new Error('Token tidak ditemukan. Periksa kembali.');
const st=statusKey(p);
if(st==='akan')throw new Error('Ujian belum dimulai. Mulai: '+fmtTgl(p.waktu_mulai));
if(st==='selesai')throw new Error('Waktu ujian untuk token ini sudah berakhir.');
let soal=Array.isArray(p.soal_json)?p.soal_json:JSON.parse(p.soal_json||'[]');
if(!soal.length)throw new Error('Paket ini belum memiliki soal.');
soal=soal.map(s=>{if((s.tipe||'PG')==='PG'){const{jawaban,...rest}=s;return rest;}return s;});
return{token:p.token,mapel:p.mapel,durasi_menit:p.durasi_menit,keterangan:p.keterangan||'',acak_soal:!!p.acak_soal,acak_opsi:!!p.acak_opsi,mode_offline:!!p.mode_offline,waktu_mulai:p.waktu_mulai,waktu_selesai:p.waktu_selesai,soal_json:soal};}
async savePaket(p,oldToken){if(oldToken&&oldToken!==p.token){if(this.d.pakets.some(x=>x.token===p.token))throw new Error('Token sudah digunakan.');this.d.pakets=this.d.pakets.filter(x=>x.token!==oldToken);p.created_at=nowISO();this.d.pakets.push(p);}else{const i=this.d.pakets.findIndex(x=>x.token===p.token);if(i>=0)this.d.pakets[i]={...this.d.pakets[i],...p};else{p.created_at=nowISO();this.d.pakets.push(p);}}this.save();return p;}
async deletePaket(token){const row=this.d.pakets.find(p=>p.token===token);this.d.pakets=this.d.pakets.filter(p=>p.token!==token);this.save();return row;}
async restorePaket(row){if(row)this.d.pakets.push(row);this.save();}
async listHasil(o={}){let h=this.d.hasil;if(o.tokens)h=h.filter(x=>o.tokens.includes(x.token));return[...h].sort((a,b)=>b.id-a.id);}
async submitUjian(d){const p=this.d.pakets.find(x=>x.token===d.token);if(!p)throw new Error('Paket tidak ditemukan.');
const soal=Array.isArray(p.soal_json)?p.soal_json:JSON.parse(p.soal_json||'[]');
let pg=0;const essay={},detail={};
soal.forEach((s,i)=>{const j=d.jawaban[i]??'';detail[i]=j;if((s.tipe||'PG')==='PG'){if(String(j).trim()===String(s.jawaban).trim())pg+=parseFloat(s.poin||0);}else essay['Soal_'+(i+1)]=j;});
const row={waktu:nowISO(),token:d.token,mapel:p.mapel,nama:d.nama,kelas:d.kelas,nis:d.nis,skor_pg:pg,jawaban_essay:essay,detail_jawaban:detail,pelanggaran:d.pelanggaran};
const i=this.d.hasil.findIndex(h=>h.token===row.token&&h.nis===row.nis&&h.mapel===row.mapel);
if(i>=0)this.d.hasil[i]={...this.d.hasil[i],...row};else{row.id=uid();this.d.hasil.push(row);}
this.save();this.addLog({username:d.nis,role:'siswa',aksi:'SUBMIT',detail:`${d.nama} · ${d.token} · PG ${pg}`});
return{skor_pg:pg};}
async gradeHasil(id,nilai,skor){const h=this.d.hasil.find(x=>x.id===id);if(h){h.nilai_essay=nilai;h.skor_essay=skor;this.save();}}
async deleteHasil(ids){const rows=this.d.hasil.filter(h=>ids.includes(h.id));this.d.hasil=this.d.hasil.filter(h=>!ids.includes(h.id));this.save();return rows;}
async restoreHasil(rows){rows.forEach(r=>this.d.hasil.push(r));this.save();}
async clearHasil(){const rows=[...this.d.hasil];this.d.hasil=[];this.save();return rows;}
async dashboard(){const hasil=this.d.hasil;const pm={};hasil.forEach(h=>{(pm[h.mapel]=pm[h.mapel]||[]).push(totalSkor(h));});
return{jumlah_guru:this.d.users.filter(u=>u.role==='guru').length,jumlah_bank:this.d.banks.length,jumlah_paket:this.d.pakets.length,jumlah_hasil:hasil.length,
rata_rata:hasil.length?hasil.reduce((a,h)=>a+totalSkor(h),0)/hasil.length:0,
jumlah_pelanggaran:hasil.reduce((a,h)=>a+(+h.pelanggaran||0),0),
per_mapel:Object.entries(pm).map(([m,a])=>({m,avg:a.reduce((x,y)=>x+y,0)/a.length,n:a.length})).sort((a,b)=>b.n-a.n).slice(0,8),
top:[...hasil].sort((a,b)=>totalSkor(b)-totalSkor(a)).slice(0,5).map(h=>({nama:h.nama,kelas:h.kelas,mapel:h.mapel,skor:totalSkor(h)})),
log:[...this.d.log].sort((a,b)=>b.id-a.id).slice(0,12)};}
async listLog(limit=30){return[...this.d.log].sort((a,b)=>b.id-a.id).slice(0,limit);}
async addLog(l){this.d.log.push({id:uid(),waktu:nowISO(),...l});if(this.d.log.length>400)this.d.log=this.d.log.slice(-400);this.save();}
async clearLog(){this.d.log=[];this.save();}
async listImages(prefix){return Object.entries(this.d.images).filter(([n])=>!prefix||n.startsWith(prefix)).map(([n,v])=>({name:n,url:v.url,created_at:v.at})).sort((a,b)=>b.created_at-a.created_at);}
imageUrl(name){return this.d.images[name]?.url||'';}
async uploadImage(blob,name){const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob);});this.d.images[name]={url,at:nowISO()};this.save();return{name,url};}
async deleteImage(name){const v=this.d.images[name];delete this.d.images[name];this.save();return v;}

/* ═══════════════ ADAPTER: SUPABASE (ADAPTIF AMAN/LEGACY) ═══════════════ */
const LEGACY_META={}; // mode legacy: kunci disimpan hanya di memori selama sesi ujian
class SupaDB{
constructor(url,key){this.mode='supabase';this.url=url;this.secure=false;this.sb=supabase.createClient(url,key,{auth:{persistSession:false}});this._imgCache={};}
err(e){if(e)throw new Error(e.message||'Kesalahan database');}
async call(fn,args){const{data,error}=await this.sb.rpc(fn,args);if(error)throw new Error(error.message);return data;}
async rpc(op,payload={}){const s=SES.load();
try{return await this.call('panel',{p_op:op,p_payload:payload,p_token:s?.token||''});}
catch(e){if(/sesi/i.test(e.message)){SES.clear();toast('Sesi berakhir. Silakan login kembali.','warn');go('#/login');}throw e;}}
async ping(){const{data,error}=await this.sb.from('pengaturan').select('key').limit(1);if(error)throw new Error(error.message);
try{await this.call('jadwal_publik',{});this.secure=true;}catch(e){this.secure=false;}return true;}
/* ── login ── */
async loginStaff(pass){if(this.secure){const r=await this.call('login_petugas',{p_username:null,p_password:pass});if(r.status!=='success')throw new Error(r.msg||'Password salah!');return{...r.user,token:r.token,exp:+r.exp};}
const{data}=await this.sb.from('users').select('*').in('role',['admin','pengawas']);
for(const u of(data||[])){if(await verifyPass(u.password_hash,pass)){if(String(u.password_hash).startsWith('plain:'))await this.upgradePass(u.id,'sha256:'+await sha256(pass));return{role:u.role,id:u.id,username:u.username,nama:u.nama_lengkap,mapel:u.mapel};}}
throw new Error('Password salah!');}
async loginGuru(username,pass){if(this.secure){const r=await this.call('login_petugas',{p_username:username,p_password:pass});if(r.status!=='success')throw new Error(r.msg||'Username atau password salah!');return{...r.user,token:r.token,exp:+r.exp};}
const{data}=await this.sb.from('users').select('*').eq('role','guru').eq('username',username).maybeSingle();
if(!data||!(await verifyPass(data.password_hash,pass)))throw new Error('Username atau password salah!');
if(String(data.password_hash).startsWith('plain:'))await this.upgradePass(data.id,'sha256:'+await sha256(pass));
return{role:'guru',id:data.id,username:data.username,nama:data.nama_lengkap,mapel:data.mapel};}
async upgradePass(id,hash){this.err((await this.sb.from('users').update({password_hash:hash}).eq('id',id)).error);}
/* ── guru ── */
async listGuru(){if(this.secure)return await this.rpc('guru_list');
const{data:u,error}=await this.sb.from('users').select('id,username,nama_lengkap,mapel,role,created_at').eq('role','guru').order('created_at',{ascending:false});this.err(error);
const{data:b,error:e2}=await this.sb.from('bank_soal').select('id,guru_id');this.err(e2);
return(u||[]).map(x=>({...x,jumlah_bank:(b||[]).filter(y=>y.guru_id===x.id).length}));}
async createGuru(g){if(this.secure)return await this.rpc('guru_save',{username:g.username,password:g.password,nama:g.nama_lengkap,mapel:g.mapel});
const{data:ex}=await this.sb.from('users').select('id').eq('username',g.username).maybeSingle();if(ex)throw new Error('Username sudah digunakan!');
const row={id:uid(),role:'guru',username:g.username,password_hash:'sha256:'+await sha256(g.password),nama_lengkap:g.nama_lengkap,mapel:g.mapel,created_at:nowISO()};
this.err((await this.sb.from('users').insert(row)).error);return row;}
async updateGuru(id,g){if(this.secure)return await this.rpc('guru_save',{id,nama:g.nama_lengkap,mapel:g.mapel,password:g.password||null});
const upd={nama_lengkap:g.nama_lengkap,mapel:g.mapel};if(g.password)upd.password_hash='sha256:'+await sha256(g.password);
this.err((await this.sb.from('users').update(upd).eq('id',id)).error);}
async deleteGuru(id){try{const imgs=await this.listImages('g'+id+'_');for(const f of imgs){try{await this.deleteImage(f.name);}catch(e){}}}catch(e){}
if(this.secure)return await this.rpc('guru_del',{id});
const{data:banks}=await this.sb.from('bank_soal').select('*').eq('guru_id',id);const{data:user}=await this.sb.from('users').select('*').eq('id',id).maybeSingle();
this.err((await this.sb.from('users').delete().eq('id',id)).error);return{user,banks:banks||[]};}
async restoreGuru(c){if(this.secure)return await this.rpc('guru_restore',c);
if(c.user)this.err((await this.sb.from('users').insert(c.user)).error);if(c.banks?.length)this.err((await this.sb.from('bank_soal').insert(c.banks)).error);}

async listBanks(guruId){if(this.secure)return await this.rpc('bank_list',{guruId:guruId??null});
let q=this.sb.from('bank_soal').select('*').order('created_at',{ascending:false});if(guruId)q=q.eq('guru_id',guruId);const{data,error}=await q;this.err(error);return data||[];}
async getBank(id){if(this.secure)return await this.rpc('bank_get',{id});const{data,error}=await this.sb.from('bank_soal').select('*').eq('id',id).maybeSingle();this.err(error);return data;}
async saveBank(b){if(this.secure)return await this.rpc('bank_save',{row:b});
if(b.id){const{id,...rest}=b;this.err((await this.sb.from('bank_soal').update(rest).eq('id',id)).error);}else{b.id=uid();b.created_at=nowISO();this.err((await this.sb.from('bank_soal').insert(b)).error);}return b;}
async deleteBank(id){if(this.secure)return await this.rpc('bank_del',{id});const{data}=await this.sb.from('bank_soal').select('*').eq('id',id).maybeSingle();this.err((await this.sb.from('bank_soal').delete().eq('id',id)).error);return data;}

async listPaket(o={}){if(this.secure){if(o.guruId)return await this.rpc('paket_list',{guruId:o.guruId});if(o.light)return await this.call('jadwal_publik',{});return await this.rpc('paket_list',{});}
const cols=o.light?'token,mapel,waktu_mulai,waktu_selesai,durasi_menit,guru_id,keterangan,acak_soal,acak_opsi,mode_offline,created_at':'*';
let q=this.sb.from('paket').select(cols).order('waktu_mulai',{ascending:false});if(o.guruId)q=q.eq('guru_id',o.guruId);const{data,error}=await q;this.err(error);return data||[];}
async getPaket(token){if(this.secure)return await this.rpc('paket_get',{token});const{data,error}=await this.sb.from('paket').select('*').eq('token',token).maybeSingle();this.err(error);return data;}
async getPaketSiswa(token){if(this.secure)return await this.call('ambil_paket_siswa',{p_token:token});
const{data:p,error}=await this.sb.from('paket').select('*').eq('token',token).maybeSingle();this.err(error);
if(!p)throw new Error('Token tidak ditemukan. Periksa kembali.');
const n=Date.now(),m=new Date(p.waktu_mulai).getTime(),s2=new Date(p.waktu_selesai).getTime();
if(n<m)throw new Error('Ujian belum dimulai. Mulai: '+fmtTgl(p.waktu_mulai));
if(n>s2)throw new Error('Waktu ujian untuk token ini sudah berakhir.');
let soal=Array.isArray(p.soal_json)?p.soal_json:JSON.parse(p.soal_json||'[]');
if(!soal.length)throw new Error('Paket ini belum memiliki soal.');
LEGACY_META[p.token]={mapel:p.mapel,soal:soal.map(x=>({tipe:x.tipe||'PG',poin:x.poin||0,jawaban:x.jawaban||''}))};
soal=soal.map(x=>{if((x.tipe||'PG')==='PG'){const{jawaban,...rest}=x;return rest;}return x;});
return{token:p.token,mapel:p.mapel,durasi_menit:p.durasi_menit,keterangan:p.keterangan||'',acak_soal:!!p.acak_soal,acak_opsi:!!p.acak_opsi,mode_offline:!!p.mode_offline,waktu_mulai:p.waktu_mulai,waktu_selesai:p.waktu_selesai,soal_json:soal};}
async savePaket(p,oldToken){if(this.secure)return await this.rpc('paket_save',{row:p,old_token:oldToken||null});
if(oldToken&&oldToken!==p.token){const{data:ex}=await this.sb.from('paket').select('token').eq('token',p.token).maybeSingle();if(ex)throw new Error('Token sudah digunakan.');this.err((await this.sb.from('paket').delete().eq('token',oldToken)).error);p.created_at=nowISO();this.err((await this.sb.from('paket').insert(p)).error);}else{this.err((await this.sb.from('paket').upsert(p)).error);}return p;}
async deletePaket(token){if(this.secure)return await this.rpc('paket_del',{token});const{data}=await this.sb.from('paket').select('*').eq('token',token).maybeSingle();this.err((await this.sb.from('paket').delete().eq('token',token)).error);return data;}
async restorePaket(row){if(this.secure)return await this.rpc('paket_restore',{row});if(row)this.err((await this.sb.from('paket').insert(row)).error);}

async listHasil(o={}){if(this.secure)return await this.rpc('hasil_list',{tokens:o.tokens||null,light:!!o.light});
const cols=o.light?'id,waktu,token,mapel,nama,kelas,nis,skor_pg,skor_essay,pelanggaran':'*';
let q=this.sb.from('hasil').select(cols).order('id',{ascending:false}).limit(1500);
if(o.tokens?.length)q=q.in('token',o.tokens);else if(o.tokens)return[];
const{data,error}=await q;this.err(error);return data||[];}
async submitUjian(d){if(this.secure)return await this.call('submit_jawaban_siswa',{p_token:d.token,p_nama:d.nama,p_kelas:d.kelas,p_nis:d.nis,p_jawaban:d.jawaban,p_pelanggaran:d.pelanggaran||0});
const meta=LEGACY_META[d.token];if(!meta)throw new Error('Sesi soal tidak ditemukan. Masuk ulang dengan token.');
let pg=0;const essay={};
meta.soal.forEach((s,i)=>{const j=d.jawaban[i]??'';if(s.tipe==='PG'){if(String(j).trim()===String(s.jawaban).trim())pg+=parseFloat(s.poin||0);}else essay['Soal_'+(i+1)]=j;});
const row={waktu:nowISO(),token:d.token,mapel:meta.mapel,nama:d.nama,kelas:d.kelas,nis:d.nis,skor_pg:pg,jawaban_essay:essay,detail_jawaban:d.jawaban,pelanggaran:d.pelanggaran||0};
const{data:ex}=await this.sb.from('hasil').select('id').eq('token',row.token).eq('nis',row.nis).eq('mapel',row.mapel).maybeSingle();
if(ex){const{id,...rest}=row;this.err((await this.sb.from('hasil').update(rest).eq('id',ex.id)).error);}else{row.id=uid();this.err((await this.sb.from('hasil').insert(row)).error);}
return{skor_pg:pg};}
async gradeHasil(id,nilai,skor){if(this.secure)return await this.rpc('hasil_grade',{id,nilai,skor});this.err((await this.sb.from('hasil').update({nilai_essay:nilai,skor_essay:skor}).eq('id',id)).error);}

async restoreHasil(rows){if(this.secure)return await this.rpc('hasil_restore',{rows});if(rows?.length)this.err((await this.sb.from('hasil').insert(rows)).error);}
async clearHasil(){if(this.secure)return await this.rpc('hasil_clear');const{data}=await this.sb.from('hasil').select('*');this.err((await this.sb.from('hasil').delete().neq('id',0)).error);return data||[];}

async seedDemo(){const d=DEMO();if(this.secure)return await this.rpc('seed',{data:{users:d.users,pengaturan:d.settings,bank_soal:d.banks,paket:d.pakets,hasil:d.hasil}});

const SES={load(){const s=LS.get('cbt_session',null);if(s&&s.exp>Date.now())return s;if(s)LS.del('cbt_session');return null;},
save(s){if(!s.exp)s.exp=Date.now()+SESSION_MS;LS.set('cbt_session',s);},
touch(){const s=LS.get('cbt_session',null);if(s&&!s.token){s.exp=Date.now()+SESSION_MS;LS.set('cbt_session',s);}},
clear(){LS.del('cbt_session');}};

document.addEventListener('click',()=>SES.touch(),{passive:true});
const RL={check(k){const r=LS.get('cbt_rl_'+k,{n:0,lock:0});if(r.lock>Date.now())return Math.ceil((r.lock-Date.now())/60000);return 0;},
hit(k){const r=LS.get('cbt_rl_'+k,{n:0,lock:0});r.n++;if(r.n>=5){r.lock=Date.now()+5*60000;r.n=0;}LS.set('cbt_rl_'+k,r);},
reset(k){LS.del('cbt_rl_'+k);}};
function genToken(len=6){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<len;i++)s+=c[Math.floor(Math.random()*c.length)];return s;}
async function compressImage(file,maxW=1000,q=.8){const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
const scale=Math.min(1,maxW/img.width);const w=Math.round(img.width*scale),h=Math.round(img.height*scale);
const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
let blob=await new Promise(r=>cv.toBlob(r,'image/webp',q));let ext='webp';
if(!blob){blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',q));ext='jpg';}
return{blob,ext};}

else if(mode==='soal')soal+='\n'+line;});
if(soal){this.add({tipe,pertanyaan:soal,opsi,jawaban:kunci,poin});added++;}});
closeModal(w);toast(`${added} soal diimport.`,'ok');};},

function flattenEssay(h){const o=h.jawaban_essay;if(!o||typeof o!=='object')return String(o||'-');return Object.entries(o).filter(([,v])=>v).map(([k,v])=>`${k}: ${v}`).join('\n')||'-';}
function totalSkor(h){return(parseFloat(h.skor_pg)||0)+(parseFloat(h.skor_essay)||0);}
async function excelHasil(rows,label){try{await LIB.xlsx();if(!rows.length)return toast('Tidak ada data.','warn');

const ws=XLSX.utils.json_to_sheet(data);ws['!cols']=[{wch:18},{wch:22},{wch:10},{wch:8},{wch:26},{wch:10},{wch:9},{wch:10},{wch:8},{wch:9},{wch:70},{wch:12}];

async function drawerHasil(h,ctx){const kkm=+S('kkm',75);const total=totalSkor(h);const lulus=total>=kkm;

const soal=paket?(Array.isArray(paket.soal_json)?paket.soal_json:JSON.parse(paket.soal_json||'[]')):null;

let review='';
if(soal){review=soal.map((s,i)=>{const j=detail[i]??detail[String(i)];const isPG=(s.tipe||'PG')==='PG';const benar=isPG&&String(j??'').trim()===String(s.jawaban).trim();
return `<div class="card p-4 ${isPG?(j===undefined?'':benar?'!border-sukses-300':'!border-bahaya-200'):''}"><div class="flex gap-2 mb-2 flex-wrap"><span class="chip bg-ink-900 text-white border-ink-900 !text-[10px] font-disp">${i+1}</span><span class="${isPG?'chip-blue':'chip-violet'} !text-[10px]">${isPG?'PG':'Essay'}</span>${isPG?(j===undefined?'<span class="chip-gray !text-[10px]">tidak dijawab</span>':benar?'<span class="chip-green !text-[10px]">✔ benar · +'+s.poin+'</span>':'<span class="chip-red !text-[10px]">✘ salah</span>'):'<span class="chip-amber !text-[10px]">koreksi di bawah</span>'}</div><div class="text-sm font-semibold mb-2">${formatTeksSoal(s.pertanyaan)}</div>${isPG?`<div class="text-xs space-y-1"><div>Jawaban: <b class="${benar?'text-sukses-700':'text-bahaya-600'}">${formatTeksSoal(j??'—')||'—'}</b></div>${!benar?`<div>Kunci: <b class="text-sukses-700">${formatTeksSoal(s.jawaban)}</b></div>`:''}</div>`:`<div class="text-xs bg-kertas-100 rounded-lg p-3 border border-kertas-200 whitespace-pre-wrap">${esc(j||'(tidak dijawab)')}</div>`}</div>`;}).join('');}
else review=`<div class="card p-4"><div class="label">Jawaban Essay</div><div class="text-sm whitespace-pre-wrap">${esc(flattenEssay(h))}</div><p class="text-[11px] text-ink-400 mt-3">Paket soal sudah dihapus — review per butir tidak tersedia. Penilaian essay total masih bisa diisi.</p></div>`;
const essays=soal?soal.map((s,i)=>({s,i})).filter(x=>x.s.tipe==='Essay'):[];
const gradeForm=ctx.canGrade?`<div class="card p-5 !border-esai-200 bg-esai-50/40"><h4 class="font-bold text-esai-700 mb-3 flex items-center gap-2">${ic('edit')} Koreksi Essay</h4>${essays.length?essays.map(({s,i})=>{const key='Soal_'+(i+1);const val=h.nilai_essay?.[key]??'';return `<div class="flex items-center justify-between gap-3 mb-2.5"><div class="text-xs font-semibold text-ink-700 flex-1">Soal ${i+1} <span class="text-ink-400">(maks ${s.poin})</span></div><input type="number" data-grade="${key}" data-max="${s.poin}" class="input !w-24 !py-2 !text-center" min="0" max="${s.poin}" value="${val}" placeholder="0"></div>`;}).join(''):`<div class="flex items-center justify-between gap-3 mb-2.5"><div class="text-xs font-semibold flex-1">Nilai essay total</div><input type="number" data-grade="total" data-max="100" class="input !w-24 !py-2 !text-center" min="0" value="${h.skor_essay??''}" placeholder="0"></div>`}
<button class="btn-ok w-full mt-2" data-d="savegrade">${ic('save')} Simpan Nilai Essay</button></div>`:'';
const w=openDrawer(drawerHead(esc(h.nama),`${esc(h.kelas)} · NIS ${esc(h.nis)} · ${esc(h.mapel)} · ${fmtTgl(h.waktu)}`)+`<div class="flex-1 overflow-y-auto exam-scroll p-5 space-y-4">
<div class="card p-5 flex items-center justify-between gap-4 flex-wrap"><div><div class="label">Nilai Akhir</div><div class="font-disp text-4xl font-bold ${lulus?'text-sukses-600':'text-bahaya-600'}">${total}</div><div class="text-[11px] text-ink-400 mt-1">PG ${h.skor_pg} ${h.skor_essay!=null?'+ Essay '+h.skor_essay:'· essay belum dikoreksi'}</div></div>
<div class="text-center"><span class="stamp ${lulus?'text-sukses-600':'text-bahaya-500'}">${lulus?'Lulus':'Belum'} · KKM ${kkm}</span><div class="mt-3">${h.pelanggaran>0?`<span class="chip-red">${ic('alert','w-3.5 h-3.5')} ${h.pelanggaran} pelanggaran</span>`:'<span class="chip-green">'+ic('shield','w-3.5 h-3.5')+' bersih</span>'}</div></div></div>
${gradeForm}<div class="label">Review Per Butir</div><div class="space-y-3">${review}</div></div>`);

bindActs(w,{savegrade:async()=>{const nilai={};let sum=0;let ok=true;
w.querySelectorAll('[data-grade]').forEach(inp=>{const max=+inp.dataset.max;let val=parseFloat(inp.value);if(inp.value===''){val=0;}if(isNaN(val)||val<0||val>max){ok=false;inp.classList.add('!border-bahaya-500');}nilai[inp.dataset.grade]=val;sum+=val;});
if(!ok)return toast('Nilai harus antara 0 dan poin maksimal.','err');
try{await DB.gradeHasil(h.id,nilai,sum);logAct('KOREKSI',`${h.nama} · essay ${sum}`);toast('Nilai essay tersimpan. Total: '+(parseFloat(h.skor_pg)+sum),'ok');closeDrawer();ctx.refresh();}catch(e){toast(e.message,'err');}}});}

function paketModal({paket,bank,guruId,banks,onSaved}){const isEdit=!!paket;const srcSoal=paket?(Array.isArray(paket.soal_json)?paket.soal_json:JSON.parse(paket.soal_json||'[]')):bank?(Array.isArray(bank.soal_json)?bank.soal_json:JSON.parse(bank.soal_json||'[]')):[];

<div class="flex gap-2 items-end"><div class="flex-1"><label class="label">Token (kosong = acak)</label><input id="pk-token" class="input font-mono !font-bold uppercase tracking-[.3em]" maxlength="10" value="${esc(paket?.token||'')}" placeholder="OTOMATIS"></div><button class="btn-soft !py-3" id="pk-dice" title="Acak token">${ic('dice','w-5 h-5')}</button></div>
<div><label class="label">Mata Pelajaran</label><input id="pk-mapel" class="input" value="${esc(paket?.mapel||bank?.mapel||'')}"></div>
<div class="grid grid-cols-2 gap-4"><div><label class="label">Waktu Mulai</label><input type="datetime-local" id="pk-mulai" class="input !text-xs" value="${defMulai}"></div><div><label class="label">Waktu Selesai</label><input type="datetime-local" id="pk-selesai" class="input !text-xs" value="${defSelesai}"></div></div>

<label class="card p-3 flex items-center gap-2.5 cursor-pointer text-sm font-semibold"><input type="checkbox" class="cbx" id="pk-acako" ${paket?(paket.acak_opsi?'checked':''):'checked'}> 🔀 Acak Opsi</label>

<p class="text-[11px] text-ink-400">Waktu mengikuti zona perangkat (${TZ}). Essay otomatis dipindah ke bagian akhir. 🔐 Kunci jawaban disimpan aman di server, tidak dikirim ke peserta.</p></div>

w.querySelector('#pk-save').onclick=async()=>{const mapel=w.querySelector('#pk-mapel').value.trim();const mulai=fromLocalInput(w.querySelector('#pk-mulai').value),selesai=fromLocalInput(w.querySelector('#pk-selesai').value);const durasi=+w.querySelector('#pk-durasi').value;

<div><label class="label">Nama Sekolah</label><input id="set-sek" class="input" value="${esc(st.nama_sekolah||'')}"></div>
<div><label class="label">Nama Ujian</label><input id="set-uj" class="input" value="${esc(st.nama_ujian||'')}"></div>
<div class="grid grid-cols-2 gap-3"><div><label class="label">KKM</label><input type="number" id="set-kkm" class="input" value="${esc(st.kkm||'75')}"></div><div><label class="label">Durasi Default (m)</label><input type="number" id="set-dur" class="input" value="${esc(st.durasi_default||'90')}"></div></div>
<div><label class="label">Daftar Kelas (pisahkan koma)</label><input id="set-kelas" class="input font-mono !text-xs" value="${esc(st.daftar_kelas||'')}"></div>
<button class="btn-pri w-full" id="set-save">${ic('save')} Simpan Pengaturan</button></div></div>
<div class="space-y-5">
<div class="card p-6 !border-sukses-200"><h3 class="font-bold text-sukses-700 mb-2">💾 Backup Database</h3><p class="text-xs text-ink-400 mb-4">Unduh seluruh data (guru, bank, paket, hasil, pengaturan, log) sebagai JSON.${DB.mode==='supabase'?' <i>(File gambar di storage tidak ikut — tetap tersimpan di bucket.)</i>':''}</p><button class="btn-ok w-full" id="sys-backup">${ic('down')} Download Backup JSON</button></div>
<div class="card p-6 !border-pensil-300"><h3 class="font-bold text-pensil-700 mb-2">📤 Restore Database</h3><p class="text-xs text-ink-400 mb-4">Ganti seluruh data dengan file backup. <b>Berbahaya</b> — data saat ini ditimpa.</p><button class="btn-amber w-full" id="sys-restore">${ic('up')} Pilih File Backup…</button></div>
<div class="card p-6"><h3 class="font-bold text-ink-900 mb-2">🧪 Data & Koneksi</h3><div class="grid grid-cols-2 gap-2.5">
<button class="btn-soft" id="sys-demo">${ic('db')} Muat Data Demo</button>
<a href="#/setup" class="btn-ghost">${ic('link')} ${DB.mode==='supabase'?(DB.secure?'Kelola Koneksi':'Upgrade ke Mode Aman'):'Hubungkan Supabase'}</a></div>
<p class="text-[11px] text-ink-400 mt-3">Mode aktif: <b>${DB.mode==='supabase'?(DB.secure?'Supabase Cloud (Aman)':'Supabase Cloud (Legacy)'):'Demo Lokal (browser)'}</b>${DB.mode==='supabase'?' · '+esc(DB.url):''}</p></div></div></div>`;
$('#set-save').onclick=async()=>{try{await DB.saveSettings({nama_sekolah:$('#set-sek').value.trim(),nama_ujian:$('#set-uj').value.trim(),kkm:$('#set-kkm').value,durasi_default:$('#set-dur').value,daftar_kelas:$('#set-kelas').value});await refreshSettings();logAct('PENGATURAN','ubah');toast('Pengaturan tersimpan.','ok');renderNav();}catch(e){toast(e.message,'err');}};
$('#sys-backup').onclick=async()=>{try{const json=await DB.exportAll();download('backup_cbt_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(json,null,2),'application/json');logAct('BACKUP','JSON');toast('Backup diunduh.','ok');}catch(e){toast(e.message,'err');}};
$('#sys-restore').onclick=()=>{const f=$('#hidden-file');f.accept='.json';f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
try{const json=JSON.parse(await file.text());if(!(await confirmBox({title:'Restore database?',body:`Backup tanggal <b>${esc(json.exported_at||'?')}</b> akan MENGGANTI seluruh data saat ini.`,okText:'Ya, Restore',danger:true})))return;
await DB.importAll(json);await refreshSettings();logAct('RESTORE','JSON');toast('Database direstore.','ok');route();}catch(e){toast('Gagal: '+e.message,'err');}};f.click();};
$('#sys-demo').onclick=async()=>{if(!(await confirmBox({title:'Muat data demo?',body:'Menambahkan akun demo (agus/guru123, hasan/hasan123), 3 bank soal, 3 paket, dan 10 hasil. Data dengan ID sama ditimpa.',okText:'Muat Demo'})))return;
try{await DB.seedDemo();await refreshSettings();toast('Data demo dimuat. Token aktif: MTK8A & PAI8B','ok');route();}catch(e){toast(e.message,'err');}};}

/* ═══════════════════════ PANEL PENGAWAS ═══════════════════════ */
async function vPengawas(v){const s=SES.load();const[pakets,hasil]=await Promise.all([DB.listPaket({light:true}),DB.listHasil({light:true})]);
const aktif=pakets.filter(p=>statusKey(p)==='aktif');
v.innerHTML=`<div class="max-w-7xl mx-auto px-4 py-8">
<div class="flex items-end justify-between gap-3 flex-wrap mb-6"><div><div class="sect-idx">PENGAWAS / MONITOR</div><h2 class="font-disp text-2xl font-bold text-ink-900 mt-1">Ruang Pantau Ujian</h2><p class="text-xs text-ink-400 mt-1">${esc(s.nama)} · nilai peserta disembunyikan untuk pengawas · refresh otomatis 20 dtk</p></div>
<div class="flex items-center gap-2">${s.role==='admin'?'<a href="#/admin" class="btn-ghost btn-xs">← Admin</a>':''}<span class="chip-green"><span class="w-1.5 h-1.5 rounded-full bg-sukses-500 live-dot"></span> LIVE ${DB.mode==='supabase'?'(poll)':'Lokal'}</span></div></div>
<div class="grid xl:grid-cols-3 gap-5">
<div class="space-y-5">
<div class="card p-5"><h3 class="font-bold mb-3">📋 Paket Aktif (${aktif.length})</h3><div class="space-y-2.5" id="pw-aktif">${aktif.length?aktif.map(p=>{const n=hasil.filter(h=>h.token===p.token).length;return `<div class="bg-kertas-100 rounded-xl p-3.5 border border-kertas-200"><div class="flex justify-between items-center gap-2"><b class="text-sm">${esc(p.mapel)}</b><span class="token-chip !text-xs">${esc(p.token)}</span></div><div class="flex justify-between text-[11px] text-ink-400 mt-1.5"><span>${p.durasi_menit} menit</span><span><b class="text-sukses-600" data-pwcount="${esc(p.token)}">${n}</b> terkirim</span></div></div>`;}).join(''):'<p class="text-sm text-ink-300">Tidak ada paket aktif.</p>'}</div></div>
<div class="card p-5 !border-sukses-200 bg-sukses-50/40"><h3 class="font-bold text-sukses-700 mb-3 flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-sukses-500 live-dot"></span> Feed Pengiriman</h3><div id="pw-feed" class="space-y-2 max-h-[420px] overflow-y-auto exam-scroll">${hasil.slice(0,12).map(h=>feedItem(h)).join('')||'<p class="text-sm text-ink-300">Menunggu peserta…</p>'}</div></div></div>
<div class="xl:col-span-2 card p-5"><div class="flex justify-between items-center gap-3 flex-wrap mb-4"><h3 class="font-bold">📊 Peserta Terkirim (<span id="pw-total">${hasil.length}</span>)</h3><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-300">${ic('search','w-4 h-4')}</span><input id="pw-q" class="input !pl-9 !py-2 !text-xs" placeholder="Cari nama / kelas…"></div></div>
<div class="overflow-auto max-h-[600px] exam-scroll rounded-xl border border-kertas-200"><table class="w-full"><thead class="bg-kertas-100 sticky top-0 z-10"><tr><th class="th">Peserta</th><th class="th">Mapel / Kelas</th><th class="th text-center">Nilai</th><th class="th text-center">Keamanan</th></tr></thead><tbody id="pw-body" class="divide-y divide-kertas-200"></tbody></table></div></div></div></div>`;
function feedItem(h){return `<div class="pop-in bg-white rounded-xl border border-sukses-100 p-3 text-xs"><div class="flex justify-between gap-2"><b>${esc(h.nama)}</b><span class="font-mono text-ink-300">${fmtTglShort(h.waktu)}</span></div><div class="flex justify-between mt-1"><span class="text-ink-400">${esc(h.kelas)} · ${esc(h.mapel)}</span>${h.pelanggaran>0?`<span class="chip-red !text-[9px] !py-0">${h.pelanggaran}× plg</span>`:'<span class="text-sukses-500">'+ic('shield','w-3.5 h-3.5')+'</span>'}</div></div>`;}
let rows=[...hasil];
const draw=()=>{const q=($('#pw-q').value||'').toLowerCase();const l=rows.filter(h=>(h.nama+h.kelas+h.mapel).toLowerCase().includes(q));
$('#pw-total').textContent=rows.length;
$('#pw-body').innerHTML=l.length?l.map(h=>`<tr class="hover:bg-biru-50/40"><td class="td"><div class="font-bold">${esc(h.nama)}</div><div class="text-[11px] text-ink-400">NIS ${esc(h.nis)} · ${fmtTglShort(h.waktu)}</div></td><td class="td text-xs"><b>${esc(h.mapel)}</b><br><span class="chip-blue !text-[9px] !py-0 mt-0.5">${esc(h.kelas)}</span></td><td class="td text-center"><span class="chip-gray !text-[10px]">🔒 tersembunyi</span></td><td class="td text-center">${h.pelanggaran>0?`<span class="chip-red">${h.pelanggaran}× ❌</span>`:'<span class="chip-green">Aman ✅</span>'}</td></tr>`).join(''):'<tr><td colspan="4" class="td text-center text-ink-300 py-8">Belum ada respons.</td></tr>';};
draw();$('#pw-q').addEventListener('input',debounce(draw,200));
const un=DB.subscribe(async p=>{try{rows=await DB.listHasil({light:true});draw();
const feed=$('#pw-feed');if(feed&&p?.poll){feed.innerHTML=rows.slice(0,12).map(h=>feedItem(h)).join('')||'<p class="text-sm text-ink-300">Menunggu peserta…</p>';}
aktif.forEach(pk=>{const el=document.querySelector(`[data-pwcount="${pk.token}"]`);if(el)el.textContent=rows.filter(x=>x.token===pk.token).length;});}catch(e){}});
onCleanup(un);}

/* ═══════════════════════ HALAMAN: SETUP (KHUSUS ADMIN) ═══════════════════════ */
async function vSetup(v){const conn=LS.get('cbt_conn',null);
v.innerHTML=`<div class="max-w-3xl mx-auto px-4 py-12">
<div class="text-center mb-10 reveal"><div class="sect-idx mb-3">SETUP / KONEKSI · AREA ADMIN</div>
<div class="mb-4"><a href="#/admin" class="btn-ghost btn-xs">${ic('chevL','w-3.5 h-3.5')} Kembali ke Panel Admin</a></div>
<h1 class="font-disp text-3xl md:text-4xl font-bold text-ink-900">Koneksi Supabase</h1><p class="text-sm text-ink-400 mt-3">Kredensial sudah tertanam di file (PRESET) — halaman ini hanya untuk verifikasi, upgrade skema, dan pemeliharaan.</p>
<div class="mt-4 flex gap-2 justify-center flex-wrap">${DB.mode==='supabase'?(DB.secure?'<span class="chip-green">● Mode Aman (RPC) aktif: '+esc(DB.url)+'</span>':'<span class="chip-amber">● Mode Legacy — jalankan SQL di bawah untuk Mode Aman</span>'):'<span class="chip-amber">● Mode Demo Lokal — tabel Supabase belum terdeteksi</span>'}</div></div>
<div class="space-y-5">
<div class="card p-6 reveal"><div class="flex gap-4"><span class="stepdot on">1</span><div class="flex-1"><h3 class="font-bold text-ink-900">Kredensial tertanam (PRESET)</h3><p class="text-xs text-ink-400 mt-1 mb-4">URL & anon key sudah berada di dalam <code class="chip-gray !text-[10px]">index.html</code> sehingga semua pengunjung otomatis tersambung. Ganti hanya jika proyek Supabase berubah.</p>
<div class="space-y-3"><div><label class="label">Project URL</label><input id="su-url" class="input font-mono !text-xs" value="${esc(conn?.url||PRESET.url||'')}"></div>
<div><label class="label">Anon Public Key</label><input id="su-key" class="input font-mono !text-xs" value="${esc(conn?.anon||PRESET.anon||'')}"></div>
<div class="flex gap-2 flex-wrap"><button class="btn-pri" id="su-test">${ic('link')} Simpan & Uji Koneksi</button>${DB.mode==='supabase'?'<button class="btn-ghost !text-bahaya-600" id="su-disc">Putuskan (kembali ke Demo)</button>':''}</div></div></div></div></div>
<div class="card p-6 reveal" style="animation-delay:.08s"><div class="flex gap-4"><span class="stepdot ${DB.mode==='supabase'&&DB.secure?'done':'on'}">2</span><div class="flex-1"><h3 class="font-bold text-ink-900">SQL skema v5.2 (sekali)</h3><p class="text-xs text-ink-400 mt-1 mb-3">Buka <b>SQL Editor</b> di dashboard Supabase → tempel → <b>Run</b>. Jika project Anda masih memakai skema lama, SQL ini sekaligus <b>meng-upgrade</b> ke Mode Aman (tabel dikunci + fungsi RPC). Aman dijalankan ulang.</p>
<div class="flex gap-2 mb-3 flex-wrap"><button class="btn-amber btn-xs" id="su-copy">${ic('copy','w-3.5 h-3.5')} Salin SQL Lengkap</button><a class="btn-ghost btn-xs" target="_blank" rel="noopener" href="https://supabase.com/dashboard/project/_/sql">${ic('link','w-3.5 h-3.5')} Buka SQL Editor</a></div>
<div class="sqlbox" id="su-sql">${esc(SQL_SCHEMA)}</div></div></div></div>
<div class="card p-6 reveal" style="animation-delay:.16s"><div class="flex gap-4"><span class="stepdot" id="su-dot3">3</span><div class="flex-1"><h3 class="font-bold text-ink-900">Verifikasi komponen</h3><p class="text-xs text-ink-400 mt-1 mb-4">Periksa fungsi keamanan & bucket. Setelah menjalankan SQL baru, muat ulang halaman lalu verifikasi ulang.</p>
<div id="su-checks" class="grid sm:grid-cols-2 gap-2 mb-4 text-xs"></div>
<div class="flex gap-2 flex-wrap"><button class="btn-pri" id="su-verify">${ic('refresh')} Verifikasi Sekarang</button><button class="btn-soft" id="su-seed">${ic('db')} Isi Data Demo</button><a href="#/siswa" class="btn-ok">${ic('check')} Mulai Aplikasi</a></div>
<div class="mt-5 bg-kertas-100 border border-kertas-300 rounded-xl p-4 text-xs"><b class="text-ink-700">Akun awal (dari SQL):</b><div class="grid sm:grid-cols-2 gap-1.5 mt-2 font-mono text-[11px]"><span>🛡 admin / <b>adminagus</b></span><span>👁 pengawas / <b>pengawas123</b></span><span>🎓 agus / <b>guru123</b></span><span>🎓 hasan / <b>hasan123</b></span></div><p class="text-ink-400 mt-2">Password otomatis di-upgrade ke SHA-256 saat login pertama. Ganti segera lewat Admin → Guru.</p></div></div></div></div>
</div></div>`;
$('#su-copy').onclick=()=>copyText(SQL_SCHEMA,'SQL disalin — tempel di SQL Editor Supabase.');
$('#su-test').onclick=async()=>{const url=$('#su-url').value.trim().replace(/\/$/,''),key=$('#su-key').value.trim();
if(!url||!key)return toast('Isi URL dan anon key.','warn');
const btn=$('#su-test');btn.disabled=true;btn.innerHTML='<span class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span> Menguji…';
try{const test=new SupaDB(url,key);await test.ping();LS.set('cbt_conn',{url,anon:key});DB=test;await refreshSettings();toast('Koneksi Supabase berhasil! Mode: '+(DB.secure?'Aman':'Legacy'),'ok');renderNav();renderBanner();$('#su-dot3').classList.add('on');}
catch(e){toast('Gagal: '+e.message+' — pastikan SQL langkah 2 sudah dijalankan.','err');}
btn.disabled=false;btn.innerHTML=ic('link')+' Simpan & Uji Koneksi';};
const disc=$('#su-disc');if(disc)disc.onclick=async()=>{LS.del('cbt_conn');DB=new LocalDB();await refreshSettings();toast('Kembali ke Mode Demo Lokal.','info');route();};
$('#su-verify').onclick=async()=>{if(DB.mode!=='supabase')return toast('Supabase belum tersambung — cek langkah 1.','warn');
const checks=[
['Pengaturan (baca publik)',async()=>{await DB.getSettings();}],
['RPC jadwal_publik',async()=>{await DB.call('jadwal_publik',{});}],
['RPC ambil_paket_siswa (tanpa kunci)',async()=>{try{await DB.call('ambil_paket_siswa',{p_token:'___'});}catch(e){if(!/token/i.test(e.message))throw e;}}],
['RPC login_petugas (server)',async()=>{const r=await DB.call('login_petugas',{p_username:'__',p_password:'__'});if(r.status!=='error')throw new Error('Respons tidak terduga');}],
['RPC panel (terkunci tanpa sesi)',async()=>{try{await DB.call('panel',{p_op:'guru_list',p_payload:{},p_token:''});throw new Error('Panel terbuka tanpa sesi!');}catch(e){if(!/sesi|akses/i.test(e.message))throw e;}}],
['Tabel paket terkunci (select langsung)',async()=>{const{error}=await DB.sb.from('paket').select('token').limit(1);if(!error)throw new Error('Tabel paket masih terbuka!');}],
['Storage gambar',async()=>{await DB.listImages();}],
];
const box=$('#su-checks');box.innerHTML=checks.map((c,i)=>`<div class="chip-gray" id="chk-${i}">⏳ ${c[0]}</div>`).join('');
let okCount=0;
for(let i=0;i<checks.length;i++){try{await checks[i][1]();okCount++;$('#chk-'+i).className='chip-green';$('#chk-'+i).textContent='✓ '+checks[i][0];}
catch(e){$('#chk-'+i).className='chip-red';$('#chk-'+i).textContent='✗ '+checks[i][0];}}
if(okCount===checks.length){$('#su-dot3').classList.add('done');toast('Semua siap & aman! Silakan mulai ujian.','ok');}
else toast(`${checks.length-okCount} komponen belum siap — jalankan/upgrade SQL langkah 2 lalu muat ulang halaman.`,'err');};
$('#su-seed').onclick=async()=>{if(DB.mode!=='supabase')return toast('Supabase belum tersambung.','warn');
const s=SES.load();if(!s||s.role!=='admin')return toast('Login sebagai admin dahulu.','warn');
try{await DB.seedDemo();await refreshSettings();toast('Data demo masuk ke Supabase! Token aktif: MTK8A & PAI8B','ok');}catch(e){toast(e.message,'err');}};}

/* ═══════════════════════ INISIALISASI ═══════════════════════ */
(async function init(){
const conn=LS.get('cbt_conn',null)||((PRESET.url&&PRESET.anon)?PRESET:null);
if(conn?.url&&conn?.anon){try{const test=new SupaDB(conn.url,conn.anon);await test.ping();DB=test;}
catch(e){console.warn('Supabase gagal, fallback demo:',e.message);setTimeout(()=>toast('Koneksi Supabase gagal / tabel belum ada — Mode Demo Lokal aktif. Login admin lalu buka Hubungkan untuk menjalankan SQL.','warn'),800);}}
await refreshSettings();
if(!location.hash)location.hash='#/siswa';
await route();
if(DB.mode==='supabase'&&!DB.secure)setTimeout(()=>toast('Mode Legacy aktif — login Admin → menu Hubungkan → jalankan SQL v5.2 untuk Mode Aman.','info'),1500);
})();
</script>
</body>
</html>
